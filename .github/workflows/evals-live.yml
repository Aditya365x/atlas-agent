name: Live evals

# Full eval suite against real models. Runs on demand, and nightly once the repository variable
# RUN_LIVE_EVALS=true and a key secret (OPENROUTER_API_KEY or GEMINI_API_KEY) are set; skipped otherwise.
on:
  workflow_dispatch:
    inputs:
      model: { description: "LiteLLM model string", default: "openrouter/inception/mercury-3" }
  schedule: [{ cron: "30 21 * * *" }]  # 03:00 IST

jobs:
  live:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.RUN_LIVE_EVALS == 'true' }}
    runs-on: ubuntu-latest
    env:
      LLM_MODE: live
      MODEL_MAIN: ${{ inputs.model || 'openrouter/inception/mercury-3' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      DAILY_USER_COST_USD: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e backend
      - name: Start API
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/readyz && break; sleep 1; done
      - name: Eval suite with LLM judge
        run: python evals/run_evals.py --min-pass 0.75 --judge-model "$MODEL_MAIN"
      - name: Publish report
        if: always()
        run: cat evals/results/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report-live, path: "evals/results/\napi.log" }
