name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: atlas, POSTGRES_PASSWORD: atlas, POSTGRES_DB: atlas }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U atlas" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests && ruff format --check app tests
      - name: Unit + API tests (SQLite, in-memory bus)
        run: pytest -q
      - name: Integration tests (Postgres + pgvector, Redis Streams)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://atlas:atlas@localhost:5432/atlas
          TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  evals-smoke:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e backend
      - name: Start API with the deterministic offline model
        working-directory: backend
        env: { LLM_MODE: fake, ENVIRONMENT: test }
        run: |
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/readyz && break; sleep 1; done
      - name: Offline eval suite (must be 100%)
        run: python evals/run_evals.py --offline --min-pass 1.0
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report-offline, path: "evals/results/\napi.log" }

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build
