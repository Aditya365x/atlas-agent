[project]
name = "atlas-agent"
version = "1.1.0"
description = "Production-grade autonomous AI agent: planning, tool use, sandboxed code execution, RAG and streaming."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "langgraph>=0.4",
  "litellm>=1.60",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "pydantic-settings>=2.4",
  "email-validator>=2.1",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "redis>=5.0",
  "arq>=0.26",
  "httpx>=0.27",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
  "pypdf>=4.3",
  "beautifulsoup4>=4.12",
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
e2b = ["e2b-code-interpreter>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E501", "ASYNC109", "ASYNC230", "B904"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
